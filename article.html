          <p class="article-like-small">
            DID YOU LIKE IT?
          </p>

          <p class="article-like-text">
            この記事、よかった？
          </p>


          <button
            class="article-like-button"
            id="articleLikeButton"
            type="button"
          >

            <span

              id="articleLikeHeart"

              ♡
            </span>

            <span
              class="article-like-count"
              id="articleLikeCount"

              0
            </span>

          </button>

        </div>
